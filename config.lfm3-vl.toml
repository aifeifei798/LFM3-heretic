# Heretic configuration for LFM3-VL-2B.
#
# Usage:
#   cp config.lfm3-vl.toml config.toml      # in the directory you run Heretic from
#   .venv/bin/heretic                       # or: .venv/bin/heretic --model <path>
#
# Upstream checkpoint: https://huggingface.co/LiquidAI/LFM3-VL-2B
# Loading by Hub ID also works; just expect the usual custom-code prompt unless
# trust_remote_code = true is set below.
#
# LFM3-VL is a hybrid architecture (short-conv blocks + full/sliding attention)
# that is not natively supported by Transformers, so its own modeling code must
# be trusted before the weights can be loaded.

model = "/home/feifei/develop/models/LFM3-VL-2B"

# Local paths are trusted automatically, so this line is only needed if you
# switch to a Hub ID above or want to be explicit. Set it to false to see the
# Transformers prompt instead.
trust_remote_code = true

# bfloat16 is what the checkpoint was trained in; no need to try anything else.
dtypes = ["auto", "bfloat16"]

# 2B parameters fit comfortably in VRAM, so let Heretic pick the batch size.
batch_size = 0
max_batch_size = 64

# Abliteration targets the text decoder only:
#   * conv layers        -> layers.N.conv.out_proj        (attn.o_proj)
#   * attention layers   -> layers.N.self_attn.o_proj     (attn.o_proj)
#   * both               -> layers.N.feed_forward.w2      (mlp.down_proj)
# The vision tower is left untouched, which is what we want for a text-only
# refusal evaluation.

# The chat template opens every assistant turn with <think>, so responses are
# evaluated after the reasoning block. The default chain_of_thought_blocks
# already contains ("<think>", "</think>").

modifiers = [
    { plugin = "heretic.modifiers.ara.ARA" },
]

n_trials = 100
n_startup_trials = 30

# Save the merged model automatically once optimization finishes.
model_action = "save"
export_strategy = "merge"
save_directory = "./LFM3-VL-2B-heretic"
